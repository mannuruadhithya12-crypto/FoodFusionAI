## Phase 16 — Default placeholder keys for CI and contributors without a real Maps key.
## Copy to local.properties (which is gitignored) and replace with your real keys.
##
## HOW TO GET A MAPS API KEY:
##   1. Go to https://console.cloud.google.com/
##   2. Create or select a project
##   3. Enable "Maps SDK for Android" and "Places API" and "Directions API"
##   4. Create an API key and restrict it to the app's package name + SHA-1 fingerprint
##   5. Add to your local.properties:  MAPS_API_KEY=AIza...
##
## IMPORTANT: Never commit real API keys to source control.
MAPS_API_KEY=YOUR_MAPS_API_KEY_HERE
